name: Build ZStream IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ios-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
          restore-keys: |
            node_modules-${{ runner.os }}-

      - name: Install npm dependencies
        working-directory: app
        run: npm ci

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          echo "XCODE_VERSION=16.4" >> "$GITHUB_ENV"

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Cache CocoaPods spec repo
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods/repos
          key: cocoapods-${{ runner.os }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Cache Pods + pod download cache
        id: pods-cache
        uses: actions/cache@v4
        with:
          path: |
            app/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('app/ios/Podfile', 'app/ios/Podfile.lock') }}

      - name: Install CocoaPods dependencies
        working-directory: app/ios
        run: pod install

      - name: Cache DerivedData
        id: dd-cache
        uses: actions/cache@v4
        with:
          path: app/ios/build
          key: dd-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('app/ios/Podfile', 'app/ios/Podfile.lock', 'app/package-lock.json') }}
          restore-keys: |
            dd-xcode${{ env.XCODE_VERSION }}-

      - name: Build app (no signing)
        run: |
          xcodebuild \
            -workspace app/ios/pstream.xcworkspace \
            -scheme ZStream \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath app/ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            OTHER_LDFLAGS="$(inherited) -framework WebKit" \
            TMDB_API_KEY="${{ secrets.TMDB_API_KEY }}" \
            BACKEND_URL="${{ secrets.BACKEND_URL }}" \
            build

      - name: Package IPA (ad-hoc signed)
        run: |
          APP_PATH=$(find app/ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::App bundle not found in build output"
            exit 1
          fi
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          codesign --force --deep --sign - dist/Payload/ZStream.app
          (cd dist && zip -qr ../ZStream.ipa Payload)
          ls -lh ZStream.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZStream-ipa
          path: ZStream.ipa
          if-no-files-found: error

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ZStream build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: ZStream.ipa
          draft: true
